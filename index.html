<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trưa nay ăn gì?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>Trưa nay ăn gì?</h1>
      <p>Quay thử thoải mái, ưng rồi mới chốt.</p>
      <div class="username-row">
        <input type="text" id="userNameInput" placeholder="Tên bạn (để hiện trong thông báo)" maxlength="30">
      </div>
    </header>

    <div class="veg-banner" id="vegBanner" style="display:none;"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="quanAn">🍚 Quán ăn</button>
      <button class="tab-btn" data-tab="quanNuoc">🥤 Quán nước</button>
    </div>

    <section class="spin-hero">

      <div class="filter-row">
        <span class="filter-label">Phân khúc giá <span class="filter-hint">(tích nhiều ô cũng được)</span>:</span>
        <div class="chip-group" id="tierChips"></div>
      </div>

      <div class="filter-row" id="modeRow">
        <span class="filter-label">Hình thức <span class="filter-hint">(tích nhiều ô cũng được)</span>:</span>
        <div class="chip-group">
          <button class="mode-chip" data-mode="diAn">🍽️ Đi ăn</button>
          <button class="mode-chip" data-mode="datApp">🛵 Đặt app</button>
        </div>
      </div>

      <div class="filter-row" id="categoryRow" style="display:none;">
        <span class="filter-label">Danh mục <span class="filter-hint">(tích nhiều ô cũng được)</span>:</span>
        <div class="chip-group">
          <button class="category-chip" data-cat="sinhTo">🥤 Sinh tố - Nước ép</button>
          <button class="category-chip" data-cat="traSua">🧋 Trà sữa</button>
          <button class="category-chip" data-cat="traTraiCay">🍹 Trà trái cây</button>
          <button class="category-chip" data-cat="caPhe">☕ Cà phê</button>
        </div>
      </div>

      <div class="filter-row" id="starRow">
        <span class="filter-label">Ngôi sao hy vọng:</span>
        <div class="chip-group">
          <button class="star-chip active" data-star="none">Không ưu tiên</button>
          <button class="star-chip" data-star="kho">🍜 Khô</button>
          <button class="star-chip" data-star="nuoc">🍲 Nước</button>
          <button class="star-chip" data-star="chacKho">✅ Chắc chắn Khô</button>
          <button class="star-chip" data-star="chacNuoc">✅ Chắc chắn Nước</button>
        </div>
      </div>

      <div class="filter-row wishlist-row" id="wishlistRow" style="display:none;">
        <button class="wishlist-toggle-btn" id="wishlistToggleBtn">🌟 Chọn quán nguyện vọng ▾</button>
        <div class="wishlist-panel" id="wishlistPanel"></div>
      </div>

      <div class="flip-card" id="flipCard"></div>

      <div class="spin-actions">
        <button class="spin-btn" id="spinBtn">🎲 Quay thử</button>
        <button class="confirm-btn" id="confirmBtn" style="display:none;">🔒 Chốt món này</button>
      </div>
      <div class="allow-repeat-row" id="allowRepeatRow" style="display:none;">
        <label class="checkbox-item">
          <input type="checkbox" id="allowRepeatCheckbox">
          🔁 Vẫn cho phép quay lại quán này lần sau
        </label>
      </div>
      <div class="skip-row">
        <button class="skip-btn" id="skipBtn">🚫 Chốt: Không đặt cơm / Không đi ăn</button>
      </div>

      <div class="email-contacts-panel" id="emailContactsPanel" style="display:none;"></div>
    </section>

    <h2 class="list-heading" id="listHeading"></h2>
    <div class="list" id="listEl"></div>

    <section class="history-section">
      <h2 class="list-heading">🗓️ Lịch sử 2 tuần qua</h2>
      <p class="history-note" id="historyNote">Đang tải lịch sử...</p>
      <div id="historyList"></div>
    </section>

    <a class="admin-link" href="quanly.html">Quản lý danh sách →</a>
  </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <img id="lightboxImg" src="" alt="Ảnh phóng to">
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="notify-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="lunar.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
